# DigitalOcean App Platform spec for the two MCP connectors.
#
# This is the production counterpart to ../docker-compose.yml (which stays
# local-dev only). It assumes a managed MySQL instance already exists
# somewhere (DigitalOcean Managed Database or otherwise) - this spec does not
# provision one.
#
# Both connectors (irs-990, grants-gov) run in one process/container behind
# one Starlette app (mcp-servers/combined_server.py) and are deployed as a
# single App Platform service, to avoid paying for two always-on instances.
# They stay independent MCP servers internally - separate FastMCP instances,
# tools, and GraphQL schemas - just mounted under /irs-990 and /grants-gov
# on the same port. See ../mcp-servers/Dockerfile.
#
# The Dockerfile lives under mcp-servers/, not docker/, because DigitalOcean
# App Platform's builder uses the Dockerfile's own directory as the build
# context (ignoring `source_dir` for that purpose) - so it can only COPY
# files that live inside or below that directory. A Dockerfile under
# docker/mcp/ referencing mcp-servers/irs-990/requirements.txt (a sibling
# of docker/, not a descendant) fails to find it on DO, even though the
# equivalent `docker build -f docker/mcp/Dockerfile .` works fine locally
# with an explicit `context: .`. docker-compose.yml's build.context is set
# to match (./mcp-servers) so local builds go through the same context DO
# uses.
#
# One-time manual step before first deploy: create the read-only irs990_ro
# user on that managed instance (App Platform has no equivalent of
# docker-entrypoint-initdb.d, so this can't run automatically on deploy).
# Export MYSQL_RO_USER/MYSQL_RO_PASSWORD (matching what's set below) and run:
#   mysql -h <host> -P <port> -u <admin user> -p <<-EOSQL
#       CREATE USER IF NOT EXISTS '$MYSQL_RO_USER'@'%' IDENTIFIED BY '$MYSQL_RO_PASSWORD';
#       GRANT SELECT ON irs990.* TO '$MYSQL_RO_USER'@'%';
#       FLUSH PRIVILEGES;
#   EOSQL
#
# Deploy with:
#   doctl apps create --spec deploy/app.yaml     # first time
#   doctl apps update <app-id> --spec deploy/app.yaml   # subsequent changes
#
# Fill in the <...> placeholders (managed MySQL host, secrets) before
# deploying.

name: grant-finder-mcp
region: nyc

domains:
  - domain: grant-finder.clementgarnier.com
    type: PRIMARY

services:
  # Matches plugin/mcp.config.release.json's
  # https://grant-finder.clementgarnier.com/irs-990/mcp and /grants-gov/mcp
  # - both paths are routed internally by combined_server.py, so this one
  # service handles the whole domain (no path-based `routes:` needed).
  - name: mcp
    dockerfile_path: mcp-servers/Dockerfile
    source_dir: /
    github:
      repo: clementgarnier/grant-finder
      branch: main
      deploy_on_push: true
    http_port: 8000
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      port: 8000
      # No http_path: a bare GET to / (or /mcp) doesn't return 200, so an
      # HTTP health check would flap. Omitting http_path falls back to a
      # plain TCP check on the port instead.
    envs:
      - key: MYSQL_HOST
        scope: RUN_TIME
        value: "<managed-mysql-host>"
      - key: MYSQL_PORT
        scope: RUN_TIME
        value: "25060"
      - key: MYSQL_DATABASE
        scope: RUN_TIME
        value: "irs990"
      - key: MYSQL_RO_USER
        scope: RUN_TIME
        value: "irs990_ro"
      - key: MYSQL_RO_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: "<fill in>"
      - key: SIMPLER_GRANTS_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: "<fill in>"
      - key: SIMPLER_GRANTS_API_BASE_URL
        scope: RUN_TIME
        value: "https://api.simpler.grants.gov"
